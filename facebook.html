<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - log in or sign up</title>
    <link rel="stylesheet" href="./facebook.css">

</head>

<body>
    <div class="container">
        <div class="left">
            <img style="transform: translate(-30px);" height="110px" width="320px"
                src="https://static.xx.fbcdn.net/rsrc.php/y1/r/4lCu2zih0ca.svg" alt="">
            <p>Connect with friends and the world around you on Facebook.
            </p>
        </div>
        <div class="right">
            <div class="form">
                <input type="email" placeholder="Email or Phone Number">
                <input type="password" placeholder="Password">
                <button class="login">Log In</button>
                <a href="#">Forgot Password?</a>
                <div class="divider"></div>
                <button class="create">Create new account</button>
            </div>
            <p class="foot"><strong>Create a Page</strong> for a celebrity, brand or business.</p>

        </div>

    </div>

</body>

</html>
