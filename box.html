<head>

    <title>Box concept in css</title>



    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        .box {
            margin: 50px;
            border: 1px black dashed;
            height: 500px;
            width: 250px;
            padding: 10px;




        }

        .box img {
            height: 200px;
            width: 100%;
        }

        button {
            padding: 8px 24px;
            margin-top: 10px;

        }
    </style>

</head>


<body>

    <div class="box">

            alt="">
